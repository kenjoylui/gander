<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spreadsheet</title>
<link rel="stylesheet" href="app.css">
<style>
  /* No viewport meta on this page, so the WebView lays out at its 980 CSS px default
     and zooms that down to fit the screen. That shrinks the status card along with
     everything else; app.css multiplies it back up by this. See the token there. */
  :root { --vw-zoom: 2.75; }

  body { background: #ffffff; }
  #tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    padding: 8px;
    background: #ECE8DF;
    border-bottom: 1px solid #CFC5B2;
  }
  #tabs button {
    flex: 0 0 auto;
    border: 1px solid #CFC5B2;
    border-radius: 16px;
    background: #ffffff;
    color: #4D4636;
    font-size: 13px;
    padding: 6px 14px;
  }
  #tabs button.active {
    background: var(--vw-accent);
    border-color: var(--vw-accent);
    color: var(--vw-accent-ink);
  }
  #sheet { padding: 8px; overflow: auto; }
  #sheet table { border-collapse: collapse; font-size: 13px; }
  #sheet td, #sheet th {
    border: 1px solid #CFC5B2;
    padding: 4px 8px;
    white-space: pre;
    min-width: 40px;
  }
  #sheet tr:first-child td { background: #F2EDE4; font-weight: 600; }

  /* A spreadsheet has no paper to be faithful to, unlike a Word page, so the whole
     thing goes dark rather than just the surround. The rules are borrowed from the
     app's night palette. The grid is #6B6250 and not the lighter outline tone: it
     clears 3:1 against the ground so the structure is still legible, while staying
     far enough behind the cell text not to compete with the numbers. */
  @media (prefers-color-scheme: dark) {
    body { background: var(--vw-ground); }
    #tabs { background: #221F19; border-bottom-color: #4D4636; }
    #tabs button { background: var(--vw-card); border-color: #4D4636; color: var(--vw-ink); }
    #sheet td, #sheet th { border-color: #6B6250; color: var(--vw-ink); }
    #sheet tr:first-child td { background: var(--vw-card); }
  }
</style>
<script src="lib/xlsx.full.min.js"></script>
</head>
<body>
<div id="vw-status" class="vw-status">Loading spreadsheet…</div>
<div id="tabs" style="display:none"></div>
<div id="sheet"></div>
<script src="app.js"></script>
<script>
vwFetchDoc("buffer")
  .then(function (buf) {
    var wb = XLSX.read(new Uint8Array(buf), { type: "array", cellDates: true });
    if (!wb.SheetNames.length) throw new Error("The workbook has no sheets");
    var tabs = document.getElementById("tabs");
    var sheetDiv = document.getElementById("sheet");
    function show(idx) {
      var ws = wb.Sheets[wb.SheetNames[idx]];
      sheetDiv.innerHTML = XLSX.utils.sheet_to_html(ws, { editable: false });
      var btns = tabs.querySelectorAll("button");
      for (var i = 0; i < btns.length; i++) btns[i].className = i === idx ? "active" : "";
    }
    wb.SheetNames.forEach(function (sn, idx) {
      var b = document.createElement("button");
      b.textContent = sn;
      b.onclick = function () { show(idx); };
      tabs.appendChild(b);
    });
    if (wb.SheetNames.length > 1) tabs.style.display = "";
    show(0);
    vwStatusDone();
  })
  .catch(function (e) { vwError("Could not open this spreadsheet", String(e)); });
</script>
</body>
</html>
